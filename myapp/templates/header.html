{% load static %}

<!-- navigation bar -->


<header id="header" class="shadow p-3 mb-2 bg-body-tertiary rounded">
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center " href="#">
        <img src="{% static 'assets\images\logo\logo.svg' %}" alt="Logo" width="50" height="50"
          class="d-inline-block align-text-top">
        <span>Veluxe</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">


        <!-- ----------------------------------------------------search bar------------------------------------------------------------------- -->

        <form class="d-flex mx-auto" role="search" method="GET" action="{% url 'shop' %}" style="width: auto;">
          <input class="form-control me-2" type="search" name="q" placeholder="Search" value="{{ request.GET.q }}" />
          <button class="btn btn-outline-success" type="submit">Search</button>
        </form>


        <!-- -----------------------------------------------------icons  ------------------------------------------------------------------- -->
        <ul class="navbar-nav mb-2 mb-lg-0">
          <li class="nav-item me-2">
            <a class="nav-link active" aria-current="page" href="{% url 'home' %}"><img
                src="{% static 'assets\images\logo\home.svg'%}" alt="home" height="30" width="30"></a>
          </li>
          <li class="nav-item me-2">
            <a class="nav-link active" aria-current="page" href="{% url 'cart' %}"><img
                src="{% static 'assets\images\logo\cart.svg'%}" alt="cart" height="30" width="30"></a>
          </li>
          <li class="nav-item me-5">
            <a class="nav-link active" aria-current="page" href="{% url 'profile' %}"><img
                src="{% static 'assets\images\logo\profile2.svg'%}" alt="profile" height="30" width="30"></a>
          </li>
        </ul>

      </div>
    </div>
  </nav>
</header>
